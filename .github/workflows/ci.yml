name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests must never depend on live third-party APIs or a real database.
      USE_FIXTURE_DATA: "true"
      DATABASE_URL: "postgresql://cleantech:cleantech@localhost:5432/cleantech_advisor?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests (fixtures only, no live network calls)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan
        # Phase 10: closes the TODO below. continue-on-error is deliberate,
        # not an oversight — this has never been run in this project's
        # history (no network access in the environment it was built in),
        # so the current dependency tree's actual audit result is unknown.
        # Run this once for real, look at what it reports, and remove
        # continue-on-error once someone has confirmed a clean (or
        # consciously accepted) baseline — a scan nobody looks at is worse
        # than no scan, because it creates false confidence.
        run: npm audit --audit-level=high
        continue-on-error: true
